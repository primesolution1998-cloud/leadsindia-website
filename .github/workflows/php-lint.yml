name: PHP Syntax Gate
on:
  pull_request:
  push:
    branches:
      - main
      - 'launch/**'
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Rainbow AI execution tests
        run: php tests/rainbow-ai-test.php
      - name: Rainbow WhatsApp automation tests
        run: php tests/rainbow-whatsapp-test.php
      - name: Rainbow loan specialist tests
        run: php tests/rainbow-loans-test.php
